name: Lockfile

# Run once by hand (Actions > Lockfile > Run workflow) to create package-lock.json and open a
# pull request with it. Needs: Settings > Actions > General > "Allow GitHub Actions to create and
# approve pull requests". After merging, CI installs with `npm ci` (integrity-checked).
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Create package-lock.json
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain package-lock.json)" ]; then
            echo "package-lock.json is already up to date."
            exit 0
          fi
          branch="chore/package-lock"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add package-lock.json
          git commit -m "Add package-lock.json"
          git push --force -u origin "$branch"
          gh pr create --head "$branch" --title "Add package-lock.json" \
            --body "Generated by the Lockfile workflow from the exact versions in package.json. With this merged, CI uses npm ci, which verifies the integrity of every package." \
            || echo "A pull request for $branch already exists."
